[workspace]
resolver = "2"
members = [
    "crates/scs-telemetry-sys",
    "crates/scs-telemetry-shared-memory",
    "crates/scs-telemetry",
    "crates/scs-telemetry-client",
    "examples/console-log",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drysius/scs-telemetry-rs"
authors = ["Drysius <daniel.alternight@gmail.com>", "scs-telemetry-rs contributors"]
description = "Pure-Rust reimplementation of the SCS SDK telemetry plugin for Euro Truck Simulator 2 and American Truck Simulator"
keywords = ["ets2", "ats", "scs", "telemetry", "gamedev"]
categories = ["game-development", "external-ffi-bindings"]

[workspace.dependencies]
scs-telemetry-sys = { path = "crates/scs-telemetry-sys", version = "0.1.0" }
scs-telemetry-shared-memory = { path = "crates/scs-telemetry-shared-memory", version = "0.1.0" }
scs-telemetry-client = { path = "crates/scs-telemetry-client", version = "0.1.0" }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_System_LibraryLoader"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
